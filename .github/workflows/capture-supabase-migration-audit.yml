name: Capture Supabase Migration Audit (Read Only)

concurrency:
  group: supabase-audit-capture
  cancel-in-progress: false

# Official and secure READ-ONLY audit workflow for Supabase Database.
# Strictly bounded:
# 1. Runs inside BEGIN TRANSACTION READ ONLY ... ROLLBACK.
# 2. Rejects any mutation fail-closed at PostgreSQL kernel level.
# 3. Transports ledger export strictly in memory (ZERO raw DDL / payload_base64 on disk or logs).
# 4. Generates docs/verification/supabase-migration-content-audit-20261024.json and preserves 20260912.json intact.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Confirmacion obligatoria (escribe exactamente CAPTURE_READONLY_AUDIT)'
        required: true
        type: string
      target_sha:
        description: 'SHA del commit para cotejar supabase/migrations (opcional, 40 hex en minuscula, por defecto HEAD del runner)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  capture:
    name: Captura de Auditoria de Migraciones Supabase (Read Only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONFIRM: ${{ inputs.confirm }}
      TARGET_SHA: ${{ inputs.target_sha }}
      EXPECTED_DB_PROJECT_REF: gqkjqhpmyejmehbuombk
      EXPECTED_DB_NAME: postgres
      EXPECTED_HOST_SUFFIX: .pooler.supabase.com
      EXPECTED_DB_PORT: '5432'
      AUDIT_SQL_FILE: scripts/audit/capture-supabase-migration-audit.sql
      RUNNER_FILE: scripts/audit/run-supabase-audit-readonly.ts
      GENERATOR_FILE: scripts/generate-supabase-migration-audit.ts
      REGISTER_FILE: scripts/test-register.mjs
      RESOLVER_FILE: scripts/test-resolver.mjs
      PROVENANCE_FILE: scripts/sql-provenance.ts
      EXPECTED_PROVENANCE_BYTES: 11118
      EXPECTED_PROVENANCE_SHA256: 5875c0cd7bc9ea519cb2ff552f3353044edb1b09a4e946fa204238c14a134383
      EXPECTED_RESOLVER_BYTES: 1438
      EXPECTED_RESOLVER_SHA256: fea63b39b23ee39a655f8a98f959945b5ea2e73c7be990661a8451195504891a
      EXPECTED_REGISTER_BYTES: 145
      EXPECTED_REGISTER_SHA256: 706a611ec2cb44dc9af1364104aa40f1e6c4284580332c0de83f6e966f571253
      EXPECTED_SQL_SHA256: 14934a1f9d7af8e4521e79415a29c46810f79ef4a7b0a4965a6d6fdd595bc932
      EXPECTED_SQL_BYTES: 6606
      EXPECTED_RUNNER_SHA256: 7e2171c36e8df720b165e6fda7dfe3035297ba557e6385b94b07cbc01e5bc785
      EXPECTED_RUNNER_BYTES: 20275
      EXPECTED_GENERATOR_SHA256: 98ac78ffa90049efeecea4750f9e13f921cc18e7407f978918d1e4e543cb83da
      EXPECTED_GENERATOR_BYTES: 26569

    steps:
      - name: Comprobar confirmacion literal y formato de parametros
        run: |
          if [ "$CONFIRM" != "CAPTURE_READONLY_AUDIT" ]; then
            echo "::error::Falta la confirmacion obligatoria. Escribe exactamente CAPTURE_READONLY_AUDIT en el campo 'confirm'."
            exit 1
          fi
          if [ -n "$TARGET_SHA" ]; then
            if [ ${#TARGET_SHA} -ne 40 ]; then
              echo "::error::El TARGET_SHA debe tener exactamente 40 caracteres."
              exit 1
            fi
            case "$TARGET_SHA" in
              *[!0-9a-f]* | "") echo "::error::El TARGET_SHA debe ser hexadecimal en minuscula."; exit 1 ;;
            esac
            echo "TARGET_SHA validado: $TARGET_SHA."
          fi
          echo "Confirmacion aceptada: CAPTURE_READONLY_AUDIT."

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Retirar salidas heredadas antes de cualquier ejecucion
        run: rm -f docs/verification/supabase-migration-content-audit-20261024.json docs/verification/supabase-audit-preflight-evidence-20261024.json

      - name: Cotejar supabase/migrations desde TARGET_SHA (opcional)
        if: env.TARGET_SHA != ''
        run: |
          echo "Cotejando supabase/migrations desde TARGET_SHA=$TARGET_SHA..."
          git fetch origin "$TARGET_SHA" || true
          if ! git cat-file -e "$TARGET_SHA^{commit}"; then
            echo "::error::El commit TARGET_SHA=$TARGET_SHA no existe en el repositorio."
            exit 1
          fi
          git checkout "$TARGET_SHA" -- supabase/migrations

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Verificar la identidad del destino sin imprimirlo
        env:
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        run: |
          python3 -I - << 'PY'
          import os, re
          from urllib.parse import urlsplit

          ALLOWED_QUERY = {"sslmode", "connect_timeout", "application_name"}
          KEY_RE = re.compile(r"^[A-Za-z_][A-Za-z0-9_]*$")

          def fail(msg):
              print(f"::error::{msg} No se imprime el valor.")
              raise SystemExit(1)

          pg = os.environ.get("POSTGRES_URL_NON_POOLING", "")
          if not pg.strip():
              fail("Falta el secreto POSTGRES_URL_NON_POOLING.")

          expected_user = "postgres." + os.environ["EXPECTED_DB_PROJECT_REF"]
          expected_db = os.environ["EXPECTED_DB_NAME"]
          expected_suffix = os.environ["EXPECTED_HOST_SUFFIX"]
          expected_port = int(os.environ["EXPECTED_DB_PORT"])

          parts = urlsplit(pg)

          if parts.scheme not in ("postgres", "postgresql"):
              fail("El esquema de conexion no es postgres ni postgresql.")

          if parts.fragment:
              fail("La cadena de conexion no debe llevar fragmento.")

          seen = set()
          for raw in filter(None, parts.query.split("&")):
              raw_key = raw.split("=", 1)[0]
              if not KEY_RE.match(raw_key):
                  fail("Clave de query con forma invalida o percent-encoding en la clave.")
              key = raw_key.lower()
              if key in seen:
                  fail(f"Clave de query duplicada: {key}.")
              seen.add(key)
              if key not in ALLOWED_QUERY:
                  fail(f"Parametro de conexion no permitido en la query: {key}.")

          try:
              port = parts.port
          except ValueError:
              fail("El puerto de la cadena de conexion no es numerico.")

          if parts.username != expected_user:
              fail("El usuario de conexion no corresponde al proyecto autorizado.")
          if not parts.hostname or not parts.hostname.endswith(expected_suffix):
              fail("El endpoint no es el pooler esperado.")
          if port != expected_port:
              fail(f"El puerto debe ser {expected_port} (Session pooler mode).")

          path = parts.path.lstrip("/")
          if path != expected_db:
              fail("La base de datos de destino no es postgres.")

          print("Destino verificado correctamente: endpoint, puerto, base y usuario conformes. Cero secretos impresos.")
          PY

      - name: Verificar integridad del script SQL READ-ONLY, runner y linea base 20260912
        run: |
          for F in "$AUDIT_SQL_FILE" "$RUNNER_FILE" "$GENERATOR_FILE" "$REGISTER_FILE" "$RESOLVER_FILE" "$PROVENANCE_FILE"; do
            if [ ! -f "$F" ]; then
              echo "::error::Falta el archivo $F."
              exit 1
            fi
          done

          # 1. Pin por contenido de capture-supabase-migration-audit.sql
          SQL_BYTES=$(wc -c < "$AUDIT_SQL_FILE" | tr -d ' ')
          SQL_SHA=$(sha256sum "$AUDIT_SQL_FILE" | cut -d' ' -f1)
          if [ "$SQL_BYTES" != "$EXPECTED_SQL_BYTES" ] || [ "$SQL_SHA" != "$EXPECTED_SQL_SHA256" ]; then
            echo "::error::El script SQL no coincide con el pin auditado. Leido: $SQL_BYTES bytes / $SQL_SHA. Esperado: $EXPECTED_SQL_BYTES / $EXPECTED_SQL_SHA256."
            exit 1
          fi

          # 2. Pin por contenido de run-supabase-audit-readonly.ts
          RUNNER_BYTES=$(wc -c < "$RUNNER_FILE" | tr -d ' ')
          RUNNER_SHA=$(sha256sum "$RUNNER_FILE" | cut -d' ' -f1)
          if [ "$RUNNER_BYTES" != "$EXPECTED_RUNNER_BYTES" ] || [ "$RUNNER_SHA" != "$EXPECTED_RUNNER_SHA256" ]; then
            echo "::error::El runner no coincide con el pin auditado. Leido: $RUNNER_BYTES bytes / $RUNNER_SHA. Esperado: $EXPECTED_RUNNER_BYTES / $EXPECTED_RUNNER_SHA256."
            exit 1
          fi

          # 2b. Pin por contenido de generate-supabase-migration-audit.ts (SHOULD-SEC-1)
          GEN_BYTES=$(wc -c < "$GENERATOR_FILE" | tr -d ' ')
          GEN_SHA=$(sha256sum "$GENERATOR_FILE" | cut -d' ' -f1)
          if [ "$GEN_BYTES" != "$EXPECTED_GENERATOR_BYTES" ] || [ "$GEN_SHA" != "$EXPECTED_GENERATOR_SHA256" ]; then
            echo "::error::El generador no coincide con el pin auditado. Leido: $GEN_BYTES bytes / $GEN_SHA. Esperado: $EXPECTED_GENERATOR_BYTES / $EXPECTED_GENERATOR_SHA256."
            exit 1
          fi

          # Bootstrap loaders and every local transitive module run only after
          # their disk bytes have been checked, before the capture has secrets.
          for KEY in REGISTER RESOLVER PROVENANCE; do
            FILE_VAR="${KEY}_FILE"
            SHA_VAR="EXPECTED_${KEY}_SHA256"
            BYTES_VAR="EXPECTED_${KEY}_BYTES"
            FILE="${!FILE_VAR}"
            if [ "$(wc -c < "$FILE" | tr -d ' ')" != "${!BYTES_VAR}" ] || [ "$(sha256sum "$FILE" | cut -d' ' -f1)" != "${!SHA_VAR}" ]; then
              echo "::error::Modulo local $KEY no coincide con el pin auditado."
              exit 1
            fi
          done

          # 3. Verificar delimitadores estrictos de solo lectura
          BEGIN_COUNT=$(grep -c 'BEGIN TRANSACTION READ ONLY;' "$AUDIT_SQL_FILE" || true)
          ROLLBACK_COUNT=$(grep -c '^ROLLBACK;$' "$AUDIT_SQL_FILE" || true)
          COMMIT_COUNT=$(grep -i -c '\bcommit\b' "$AUDIT_SQL_FILE" || true)

          if [ "$BEGIN_COUNT" -lt 1 ] || [ "$ROLLBACK_COUNT" -lt 1 ] || [ "$COMMIT_COUNT" -ne 0 ]; then
            echo "::error::Delimitadores invalidos en $AUDIT_SQL_FILE (begin=$BEGIN_COUNT rollback=$ROLLBACK_COUNT commit=$COMMIT_COUNT)."
            exit 1
          fi

          # 4. Verificar linea base 20260912
          BASE="docs/verification/supabase-migration-content-audit-20260912.json"
          EXPECTED_BASE_SHA="a6ee59dafc1c27f1b484b0a9de1bdca9b8f35ca8d733d93ca637212683ef4feb"
          ACTUAL_BASE_SHA=$(sha256sum "$BASE" | cut -d' ' -f1)
          if [ "$ACTUAL_BASE_SHA" != "$EXPECTED_BASE_SHA" ]; then
            echo "::error::La linea base 20260912.json fue alterada. Obtenido $ACTUAL_BASE_SHA."
            exit 1
          fi

          echo "Pines por contenido y delimitadores verificados: 100% READ ONLY y ROLLBACK estricto."

      - name: Ejecutar captura de auditoria en memoria
        env:
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          node --import ./scripts/test-register.mjs --experimental-strip-types scripts/audit/run-supabase-audit-readonly.ts

      - name: Validar integridad de artefactos generados y preservacion de 20260912
        run: |
          OUT="docs/verification/supabase-migration-content-audit-20261024.json"
          PRE="docs/verification/supabase-audit-preflight-evidence-20261024.json"

          if [ ! -f "$OUT" ] || [ ! -f "$PRE" ]; then
            echo "::error::Los artefactos de auditoria no fueron generados."
            exit 1
          fi

          # Comprobar cero fuga de payload_base64 crudo en ambos artefactos
          if grep -q '"payload_base64":' "$OUT"; then
            echo "::error::El artefacto de auditoria contiene payload_base64 crudo. Violacion de confidencialidad."
            exit 1
          fi

          if grep -q '"payload_base64":' "$PRE"; then
            echo "::error::La evidencia preflight contiene payload_base64 crudo. Violacion de confidencialidad."
            exit 1
          fi

          echo "Validacion exitosa: 0 fuga de payloads en ambos artefactos."

      - name: Subir evidencia preflight como artefacto
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-audit-preflight-evidence-20261024
          path: docs/verification/supabase-audit-preflight-evidence-20261024.json
          if-no-files-found: error

      - name: Subir artefacto de auditoria 20261024
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-migration-content-audit-20261024
          path: docs/verification/supabase-migration-content-audit-20261024.json
          if-no-files-found: error
