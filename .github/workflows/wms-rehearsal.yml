name: WMS E1 rehearsal (manual)

# SÓLO manual. Este flujo abre una conexión Postgres contra producción y ejecuta el
# ensayo de la migración E1 dentro de BEGIN … ROLLBACK. No debe dispararse nunca por
# push ni por pull_request: si alguien lo añade, el ensayo dejaría de ser una acción
# deliberada y pasaría a correr en cada cambio.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe REHEARSAL para confirmar que quieres ejecutar el ensayo contra producción'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Un ensayo a la vez: dos ejecuciones simultáneas sobre la misma base se estorban.
  group: wms-e1-rehearsal
  cancel-in-progress: false

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Comprobar la confirmación
        run: |
          if [ "${{ inputs.confirm }}" != "REHEARSAL" ]; then
            echo "::error::Falta la confirmación. Escribe REHEARSAL en el campo 'confirm'."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Comprobar que el secreto existe (sin imprimirlo)
        env:
          PG: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        run: |
          if [ -z "$PG" ]; then
            echo "::error::Falta el secreto POSTGRES_URL_NON_POOLING en el repositorio. Sin él no hay ensayo."
            exit 1
          fi
          echo "Secreto presente (no se imprime su valor)."

      - name: Ensayo transaccional (BEGIN … ROLLBACK)
        env:
          # Sólo se expone a este paso. El ensayo lo lee de FORNEXA_PRODUCTION_DB_URL o de
          # POSTGRES_URL_NON_POOLING; se pasan ambos por comodidad y no se imprimen nunca.
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          FORNEXA_PRODUCTION_DB_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        run: node --experimental-strip-types scripts/wms/rehearse_wms_e1.ts

      - name: Publicar el recibo como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wms-e1-rehearsal-receipt
          path: docs/verification/wms-e1-rehearsal-receipt.json
          if-no-files-found: warn
          retention-days: 30

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Ensayo WMS E1"
            echo ""
            if [ -f docs/verification/wms-e1-rehearsal-receipt.json ]; then
              echo "El recibo se ha generado. Descárgalo del artefacto \`wms-e1-rehearsal-receipt\`."
              echo ""
              echo '```json'
              head -c 2000 docs/verification/wms-e1-rehearsal-receipt.json
              echo '```'
            else
              echo "**No se generó recibo.** El ensayo no llegó al final; revisa el log del paso anterior."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
