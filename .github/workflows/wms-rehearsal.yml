name: WMS E1 rehearsal (manual)

# SÓLO manual. Abre una conexión Postgres contra producción y ejecuta el ensayo de la
# migración E1 dentro de BEGIN … ROLLBACK. No debe dispararse por push ni por pull_request.
#
# ── Sobre el secreto ────────────────────────────────────────────────────────────────
# El secreto se llama POSTGRES_URL_NON_POOLING, pero lo que necesita es la cadena del
# POOLER en modo sesión, NO el host directo. OJO: la integración de Supabase con Vercel
# pone en esa variable el host DIRECTO (db.<ref>.supabase.co, usuario `postgres`), así que
# NO se copia de Vercel: el host directo es sólo IPv4, no resuelve desde un runner y el
# fallo parecería un fallo del ensayo.
#
# La cadena buena sale de Supabase -> Project Settings -> Database -> Connection string ->
# pestaña «Session pooler», con la forma:
#   postgresql://postgres.<ref>:<PASSWORD>@aws-0-<región>.pooler.supabase.com:5432/postgres
# El password no aparece ahí (está enmascarado): hay que tenerlo o resetearlo. Puerto 5432
# (modo sesión), no 6543 (transaccional), que rompería la atomicidad del ensayo.
# El paso «Comprobar el secreto» verifica la forma sin imprimir el valor.
on:
  workflow_dispatch:
    inputs:
      sha:
        # El ensayo NO vive en main: vive en la rama del PR de E1. Por eso se pide el SHA
        # exacto que se quiere ensayar y se verifica tras el checkout. Ejecutar «la rama tal
        # cual» no acreditaría el código revisado.
        description: 'SHA completo (40 hex) del commit a ensayar — el revisado, no una rama'
        required: true
        type: string
      confirm:
        description: 'Escribe REHEARSAL para confirmar que quieres ejecutar el ensayo contra producción'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wms-e1-rehearsal
  cancel-in-progress: false

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Las entradas se pasan por entorno y se comparan como texto literal. Interpolarlas
      # directamente dentro de `run` las convertiría en código shell (script injection), y
      # este es el único job que sostendrá una credencial de producción.
      CONFIRM: ${{ inputs.confirm }}
      TARGET_SHA: ${{ inputs.sha }}
      RECEIPT: docs/verification/wms-e1-rehearsal-receipt.json
      OK_MARKER: .wms-rehearsal-ok
      START_MARKER: .wms-rehearsal-start
    steps:
      - name: Preparar el runner (sin tocar el árbol todavía)
        run: |
          # Aquí todavía no hay árbol: el checkout viene después. La limpieza real del recibo
          # commiteado se hace tras el checkout, y se exige que el recibo sea posterior al
          # inicio del ensayo. Este paso solo deja constancia de que se ejecutó.
          echo "Runner preparado. La limpieza del recibo commiteado se hace tras el checkout."

      - name: Comprobar la confirmación
        run: |
          if [ "$CONFIRM" != "REHEARSAL" ]; then
            echo "::error::Falta la confirmación. Escribe REHEARSAL en el campo 'confirm'."
            exit 1
          fi
          case "$TARGET_SHA" in
            *[!0-9a-f]* | "") echo "::error::El SHA debe ser 40 caracteres hex en minúscula."; exit 1 ;;
          esac
          if [ "${#TARGET_SHA}" -ne 40 ]; then
            echo "::error::El SHA debe tener 40 caracteres; tiene ${#TARGET_SHA}."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Verificar el árbol y retirar cualquier recibo anterior
        run: |
          ACTUAL=$(git rev-parse HEAD)
          if [ "$ACTUAL" != "$TARGET_SHA" ]; then
            echo "::error::El checkout no corresponde al SHA pedido: $ACTUAL ≠ $TARGET_SHA"
            exit 1
          fi
          if [ ! -f scripts/wms/rehearse_wms_e1.ts ]; then
            echo "::error::El SHA $TARGET_SHA no contiene scripts/wms/rehearse_wms_e1.ts. El ensayo vive en la rama de E1, no en main: indica ese SHA."
            exit 1
          fi
          echo "Árbol verificado en $ACTUAL"
          # Limpieza REAL: el `rm` del primer paso corre antes del checkout, donde el fichero
          # todavía no existe (runner limpio) y es un no-op; acto seguido, actions/checkout
          # restaura el recibo COMMITEADO. Se retira aquí, ya con el árbol en su sitio.
          rm -f "$RECEIPT"
          rm -rf .wms-artifacts
          rm -f "$OK_MARKER"
          # Marca de tiempo: el recibo deberá ser POSTERIOR a este instante.
          touch "$START_MARKER"
          test ! -f "$RECEIPT"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Comprobar el secreto (sin imprimirlo)
        env:
          PG: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        run: |
          if [ -z "$PG" ]; then
            echo "::error::Falta el secreto POSTGRES_URL_NON_POOLING. Sin él no hay ensayo."
            exit 1
          fi
          case "$PG" in
            *pooler.supabase.com*) : ;;
            *)
              echo "::error::La cadena no apunta al pooler (…pooler.supabase.com:5432). El host directo db.<ref>.supabase.co es sólo IPv4 y no resuelve desde un runner: el fallo parecería del ensayo. No se imprime el valor."
              exit 1
              ;;
          esac
          echo "Secreto presente y con forma de pooler (no se imprime su valor)."

      - name: Ensayo transaccional (BEGIN … ROLLBACK)
        env:
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
          FORNEXA_PRODUCTION_DB_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        run: |
          # El recibo se borra INMEDIATAMENTE antes del ensayo. Así, que exista después prueba
          # que lo escribió este run, sin depender de marcas de tiempo: un ensayo que salga con
          # código 0 sin escribir recibo no puede heredar el fichero commiteado.
          rm -f "$RECEIPT"
          node --experimental-strip-types scripts/wms/rehearse_wms_e1.ts

      - name: Exigir un recibo NUEVO de este run
        run: |
          if [ ! -f "$RECEIPT" ]; then
            echo "::error::El ensayo terminó sin generar recibo. No hay evidencia que publicar."
            exit 1
          fi
          # No basta con que exista: tiene que ser POSTERIOR al inicio de este run. Un ensayo
          # que salga con código 0 sin escribir recibo dejaría el fichero commiteado y esta
          # comprobación lo aceptaría como evidencia fresca.
          if [ ! "$RECEIPT" -nt "$START_MARKER" ]; then
            echo "::error::El recibo no es de este run (anterior a $START_MARKER). No se publica."
            exit 1
          fi
          # Marca de éxito: sólo existe si el ensayo generó recibo en ESTE run.
          printf 'sha=%s\nrun=%s\n' "$TARGET_SHA" "$GITHUB_RUN_ID" > "$OK_MARKER"
          # Sólo si hubo éxito llega el recibo a este directorio, que es lo único que se sube.
          mkdir -p .wms-artifacts
          cp "$RECEIPT" .wms-artifacts/wms-e1-rehearsal-receipt.json
          echo "Recibo nuevo generado por este run."

      - name: Escribir los metadatos del run
        if: always()
        run: |
          mkdir -p docs/verification
          RUNNER_SHA=$(sha256sum scripts/wms/rehearse_wms_e1.ts 2>/dev/null | cut -d' ' -f1 || echo "no-disponible")
          MIGRATION_SHA=$(sha256sum supabase/migrations/20261017110000_wms_e1_core.sql 2>/dev/null | cut -d' ' -f1 || echo "no-disponible")
          RECEIPT_PRESENT=false
          [ -f "$RECEIPT" ] && RECEIPT_PRESENT=true
          OK=false
          [ -f "$OK_MARKER" ] && OK=true
          SHORT_SHA=$(printf '%s' "$TARGET_SHA" | cut -c1-12)
          cat > docs/verification/wms-e1-rehearsal-run-metadata.json <<JSON
          {
            "rehearsed_sha": "${TARGET_SHA}",
            "verified_head": "$(git rev-parse HEAD 2>/dev/null || echo desconocido)",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "workflow_ref": "${GITHUB_WORKFLOW_REF}",
            "runner_sha256": "${RUNNER_SHA}",
            "migration_sha256": "${MIGRATION_SHA}",
            "rehearsal_ok": ${OK},
            "receipt_present": ${RECEIPT_PRESENT},
            "finished_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          cat docs/verification/wms-e1-rehearsal-run-metadata.json

      - name: Publicar recibo y metadatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # El nombre lleva el SHA corto: un recibo no puede confundirse con el de otro árbol.
          name: wms-e1-rehearsal-${{ inputs.sha }}
          path: |
            .wms-artifacts/wms-e1-rehearsal-receipt.json
            docs/verification/wms-e1-rehearsal-run-metadata.json
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Ensayo WMS E1"
            echo ""
            echo "- SHA ensayado: \`${TARGET_SHA}\`"
            echo "- Run: \`${GITHUB_RUN_ID}\`"
            echo ""
            # No basta con que el fichero exista: se comprueba la marca de ESTE run.
            if [ -f "$OK_MARKER" ] && [ -f .wms-artifacts/wms-e1-rehearsal-receipt.json ]; then
              if grep -q 'postgres://' .wms-artifacts/wms-e1-rehearsal-receipt.json 2>/dev/null; then
                echo "**Recibo generado, pero contiene una cadena de conexión: no se imprime.** Descárgalo del artefacto y trátalo como material sensible."
              else
                echo "**Recibo nuevo generado por este run.** Descárgalo del artefacto \`wms-e1-rehearsal-${TARGET_SHA}\`."
                echo ""
                echo '```json'
                head -c 2000 .wms-artifacts/wms-e1-rehearsal-receipt.json
                echo '```'
              fi
            else
              echo "**FALLIDO: no hay recibo de este run.** No se publica ningún PASSED heredado; revisa el log del paso que falló."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
