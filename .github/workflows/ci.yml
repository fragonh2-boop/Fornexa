name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rehearse-c3-apply-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fornexa_apply_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Remove inherited PG17 verification receipts
        run: rm -f docs/verification/receipt-c3-workflow-pg17.json docs/verification/receipt-orphan-recovery-pg17.json
      - name: Verify workflow on disposable PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: fornexa_apply_test
          PGUSER: postgres
          PGPASSWORD: synthetic-ci-password
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          python3 scripts/wms/verify-c3-apply-workflow.py --postgres
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: receipt-c3-workflow-pg17
          path: docs/verification/receipt-c3-workflow-pg17.json
          if-no-files-found: error
      - name: Verify orphan recovery migration chain on PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: fornexa_apply_test
          PGUSER: postgres
          PGPASSWORD: synthetic-ci-password
        run: |
          node scripts/audit/verify-orphan-recovery-pg17.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: receipt-orphan-recovery-pg17
          path: docs/verification/receipt-orphan-recovery-pg17.json
          if-no-files-found: error

  verify-e2-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fornexa_e2_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Remove inherited E2 verification receipt
        run: rm -f docs/verification/receipt-m8-e2-postgres17.json
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile-driver/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify WMS E2 Replenishment Runtime on disposable PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: fornexa_e2_test
          PGUSER: postgres
          PGPASSWORD: synthetic-ci-password
          USE_REAL_POSTGRES: "true"
          REQUIRE_PG17: "true"
          HEAD_SHA: ${{ github.sha }}
        run: |
          rm -f docs/verification/receipt-m8-e2-postgres17.json
          node scripts/wms/verify-e2-postgres.mjs
      - name: Upload WMS E2 Verification Receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receipt-m8-e2-postgres17
          path: docs/verification/receipt-m8-e2-postgres17.json
          if-no-files-found: error

  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fornexa_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove inherited verification receipts
        run: rm -f docs/verification/receipt-m7-c3-postgres.json docs/verification/receipt-m8-e2-postgres17.json

      - name: Require memorandum update for functional changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/check-memorandum-update.mjs "$BASE_SHA" "$HEAD_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile-driver/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web
        run: pnpm typecheck

      - name: Lint web
        run: pnpm lint

      - name: Verify WMS C-3 Server Controls (PostgreSQL Relational Execution)
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: fornexa_test
          PGUSER: postgres
          PGPASSWORD: testpassword123
          USE_REAL_POSTGRES: "true"
        run: |
          # Never upload a committed receipt if the harness aborts before writing.
          rm -f docs/verification/receipt-m7-c3-postgres.json
          node scripts/wms/verify-c3-postgres.mjs

      - name: Validate WMS C-3 Relational Receipt (Post-Harness Certification)
        env:
          WMS_CURRENT_RUN_RECEIPT: "true"
        run: node --experimental-test-module-mocks --import ./scripts/test-register.mjs --experimental-strip-types --test tests/wms-c3-server-controls.test.ts

      - name: Test web
        run: pnpm test

      - name: Upload WMS C-3 Verification Receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receipt-m7-c3-postgres
          path: docs/verification/receipt-m7-c3-postgres.json
          if-no-files-found: error

      - name: Build web
        run: pnpm build

      - name: Install Mobile dependencies
        working-directory: mobile-driver
        run: pnpm install --frozen-lockfile

      - name: Typecheck Mobile
        working-directory: mobile-driver
        run: pnpm typecheck
