name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fornexa_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require memorandum update for functional changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/check-memorandum-update.mjs "$BASE_SHA" "$HEAD_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile-driver/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web
        run: pnpm typecheck

      - name: Lint web
        run: pnpm lint

      - name: Test web
        run: pnpm test

      - name: Verify WMS C-3 Server Controls (PostgreSQL Relational Execution)
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: fornexa_test
          PGUSER: postgres
          PGPASSWORD: testpassword123
          USE_REAL_POSTGRES: "true"
        run: node scripts/wms/verify-c3-postgres.mjs

      - name: Build web
        run: pnpm build

      - name: Install Mobile dependencies
        working-directory: mobile-driver
        run: pnpm install --frozen-lockfile

      - name: Typecheck Mobile
        working-directory: mobile-driver
        run: pnpm typecheck
