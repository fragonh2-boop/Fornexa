name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile-driver/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web
        run: pnpm typecheck

      - name: Lint web
        run: pnpm lint

      - name: Build web
        run: pnpm build

      - name: Install Mobile dependencies
        working-directory: mobile-driver
        run: pnpm install --frozen-lockfile

      - name: Typecheck Mobile
        working-directory: mobile-driver
        run: pnpm typecheck
